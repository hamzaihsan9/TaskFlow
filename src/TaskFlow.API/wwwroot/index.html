<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow — Clean Architecture Management Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --purple: #8b5cf6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #111827;
      border-bottom: 1px solid var(--card-border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 1.35rem;
      font-weight: 700;
      color: #60a5fa;
    }
    .brand span {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .badge-arch {
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.4);
      color: #93c5fd;
      font-size: 0.75rem;
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      font-weight: 500;
    }
    .header-links {
      display: flex;
      gap: 1rem;
      align-items: center;
    }
    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.55rem 1.1rem;
      border-radius: 0.5rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.9rem;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--primary-hover); }
    .btn-secondary {
      background: #334155;
      color: #e2e8f0;
    }
    .btn-secondary:hover { background: #475569; }
    .btn-danger {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }
    .btn-danger:hover { background: rgba(239, 68, 68, 0.4); }

    main {
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 2rem auto;
      padding: 0 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.25rem;
    }
    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 0.75rem;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .stat-label { font-size: 0.85rem; color: var(--text-muted); font-weight: 500; }
    .stat-value { font-size: 1.85rem; font-weight: 700; color: #fff; }

    /* Controls */
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      background: var(--card-bg);
      padding: 1rem;
      border-radius: 0.75rem;
      border: 1px solid var(--card-border);
    }
    .filters {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      flex-wrap: wrap;
    }
    select {
      background: #0f172a;
      border: 1px solid var(--card-border);
      color: #f8fafc;
      padding: 0.5rem 0.8rem;
      border-radius: 0.4rem;
      font-size: 0.88rem;
    }

    /* Tasks Grid */
    .tasks-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1.25rem;
    }
    .task-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 0.75rem;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 1rem;
      transition: transform 0.2s, border-color 0.2s;
    }
    .task-card:hover {
      transform: translateY(-2px);
      border-color: #475569;
    }
    .task-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.5rem;
    }
    .task-title { font-size: 1.1rem; font-weight: 600; line-height: 1.4; color: #f1f5f9; }
    .task-desc { font-size: 0.88rem; color: var(--text-muted); line-height: 1.5; }
    .meta-tags {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-top: 0.5rem;
    }
    .tag {
      font-size: 0.75rem;
      padding: 0.2rem 0.5rem;
      border-radius: 0.35rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .priority-Critical { background: rgba(239, 68, 68, 0.25); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }
    .priority-High { background: rgba(245, 158, 11, 0.25); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.4); }
    .priority-Medium { background: rgba(59, 130, 246, 0.25); color: #93c5fd; border: 1px solid rgba(59, 130, 246, 0.4); }
    .priority-Low { background: rgba(100, 116, 139, 0.25); color: #cbd5e1; border: 1px solid rgba(100, 116, 139, 0.4); }

    .status-Completed { background: rgba(16, 185, 129, 0.2); color: #34d399; }
    .status-InProgress { background: rgba(139, 92, 246, 0.2); color: #c084fc; }
    .status-Pending { background: rgba(148, 163, 184, 0.2); color: #cbd5e1; }

    .category-badge {
      background: #1e1b4b;
      color: #a5b4fc;
      border: 1px solid #3730a3;
    }

    .task-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.07);
      padding-top: 0.75rem;
    }
    .date-label { font-size: 0.75rem; color: #64748b; }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      width: 100%;
      max-width: 500px;
      border-radius: 0.75rem;
      padding: 1.75rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    .modal h2 { font-size: 1.25rem; color: #f8fafc; }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .form-group label {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
    }
    .form-group input, .form-group textarea, .form-group select {
      background: #0f172a;
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 0.6rem 0.8rem;
      border-radius: 0.4rem;
      font-family: inherit;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
      margin-top: 0.5rem;
    }
    .alert {
      padding: 0.65rem 1rem;
      border-radius: 0.4rem;
      font-size: 0.85rem;
      display: none;
    }
    .alert-error {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span>TaskFlow</span>
      <span class="badge-arch">C# .NET 6 Clean Architecture</span>
    </div>
    <div class="header-links">
      <a href="/swagger" target="_blank" class="btn btn-secondary">📖 Swagger UI</a>
      <button class="btn" onclick="openCreateModal()">+ New Task</button>
    </div>
  </header>

  <main>
    <!-- Stats Cards -->
    <div class="stats-grid">
      <div class="stat-card">
        <span class="stat-label">Total Tasks</span>
        <span class="stat-value" id="stat-total">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Pending</span>
        <span class="stat-value" id="stat-pending" style="color: #cbd5e1;">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">In Progress</span>
        <span class="stat-value" id="stat-in-progress" style="color: #c084fc;">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Completed</span>
        <span class="stat-value" id="stat-completed" style="color: #34d399;">0</span>
      </div>
    </div>

    <!-- Filters & Actions -->
    <div class="controls">
      <div class="filters">
        <span style="font-size: 0.88rem; color: var(--text-muted); font-weight: 500;">Filter by:</span>
        <select id="filter-status" onchange="filterTasks()">
          <option value="All">All Statuses</option>
          <option value="Pending">Pending</option>
          <option value="InProgress">In Progress</option>
          <option value="Completed">Completed</option>
        </select>
        <select id="filter-category" onchange="filterTasks()">
          <option value="All">All Categories</option>
        </select>
      </div>
      <div>
        <button class="btn btn-secondary" onclick="loadAllData()">🔄 Refresh</button>
      </div>
    </div>

    <!-- Tasks List Container -->
    <div id="tasks-container" class="tasks-grid"></div>
  </main>

  <!-- Create Task Modal -->
  <div id="create-modal" class="modal-overlay">
    <div class="modal">
      <h2>Create New Task</h2>
      <div id="modal-error" class="alert alert-error"></div>

      <div class="form-group">
        <label>Title *</label>
        <input type="text" id="task-title" placeholder="e.g., Implement Authentication Middleware">
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea id="task-desc" rows="3" placeholder="Provide extra context or requirements..."></textarea>
      </div>

      <div class="form-group">
        <label>Priority *</label>
        <select id="task-priority">
          <option value="Low">Low</option>
          <option value="Medium" selected>Medium</option>
          <option value="High">High</option>
          <option value="Critical">Critical</option>
        </select>
      </div>

      <div class="form-group">
        <label>Category</label>
        <select id="task-category">
          <option value="">None (Uncategorized)</option>
        </select>
      </div>

      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeCreateModal()">Cancel</button>
        <button class="btn" onclick="submitCreateTask()">Save Task</button>
      </div>
    </div>
  </div>

  <script>
    let allTasks = [];
    let allCategories = [];

    async function loadCategories() {
      try {
        const res = await fetch('/api/categories');
        allCategories = await res.json();
        
        const filterSelect = document.getElementById('filter-category');
        const modalSelect = document.getElementById('task-category');

        filterSelect.innerHTML = '<option value="All">All Categories</option>';
        modalSelect.innerHTML = '<option value="">None (Uncategorized)</option>';

        allCategories.forEach(cat => {
          filterSelect.innerHTML += `<option value="${cat.id}">${cat.name}</option>`;
          modalSelect.innerHTML += `<option value="${cat.id}">${cat.name}</option>`;
        });
      } catch (err) {
        console.error('Failed to load categories', err);
      }
    }

    async function loadTasks() {
      try {
        const res = await fetch('/api/tasks');
        allTasks = await res.json();
        updateStats();
        filterTasks();
      } catch (err) {
        console.error('Failed to load tasks', err);
      }
    }

    function updateStats() {
      document.getElementById('stat-total').textContent = allTasks.length;
      document.getElementById('stat-pending').textContent = allTasks.filter(t => t.status === 'Pending').length;
      document.getElementById('stat-in-progress').textContent = allTasks.filter(t => t.status === 'InProgress').length;
      document.getElementById('stat-completed').textContent = allTasks.filter(t => t.status === 'Completed').length;
    }

    function filterTasks() {
      const statusFilter = document.getElementById('filter-status').value;
      const catFilter = document.getElementById('filter-category').value;

      const filtered = allTasks.filter(task => {
        const matchesStatus = (statusFilter === 'All') || (task.status === statusFilter);
        const matchesCat = (catFilter === 'All') || (task.categoryId == catFilter);
        return matchesStatus && matchesCat;
      });

      renderTasks(filtered);
    }

    function renderTasks(tasks) {
      const container = document.getElementById('tasks-container');
      if (tasks.length === 0) {
        container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #64748b; padding: 3rem;">No tasks found. Click "+ New Task" to create one!</div>`;
        return;
      }

      container.innerHTML = tasks.map(task => `
        <div class="task-card">
          <div>
            <div class="task-header">
              <h3 class="task-title">${escapeHtml(task.title)}</h3>
            </div>
            <p class="task-desc">${escapeHtml(task.description || 'No description provided.')}</p>
            <div class="meta-tags">
              <span class="tag priority-${task.priority}">${task.priority}</span>
              <span class="tag status-${task.status}">${task.status}</span>
              ${task.categoryName ? `<span class="tag category-badge">📁 ${escapeHtml(task.categoryName)}</span>` : ''}
            </div>
          </div>
          <div class="task-actions">
            <span class="date-label">Added ${new Date(task.createdAt).toLocaleDateString()}</span>
            <div style="display: flex; gap: 0.4rem;">
              ${task.status !== 'Completed' ? `
                <button class="btn btn-secondary" style="padding: 0.35rem 0.6rem; font-size: 0.75rem;" onclick="markComplete(${task.id})">✓ Done</button>
              ` : ''}
              <button class="btn btn-danger" style="padding: 0.35rem 0.6rem; font-size: 0.75rem;" onclick="deleteTask(${task.id})">🗑️</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    async function submitCreateTask() {
      const errorDiv = document.getElementById('modal-error');
      errorDiv.style.display = 'none';

      const title = document.getElementById('task-title').value.trim();
      const description = document.getElementById('task-desc').value.trim();
      const priority = document.getElementById('task-priority').value;
      const catVal = document.getElementById('task-category').value;
      const categoryId = catVal ? parseInt(catVal) : null;

      try {
        const res = await fetch('/api/tasks', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, description, priority, categoryId })
        });

        if (!res.ok) {
          const errData = await res.json();
          errorDiv.textContent = errData.message || 'Validation failed.';
          errorDiv.style.display = 'block';
          return;
        }

        closeCreateModal();
        await loadTasks();
      } catch (err) {
        errorDiv.textContent = 'Network error communicating with the API.';
        errorDiv.style.display = 'block';
      }
    }

    async function markComplete(id) {
      const task = allTasks.find(t => t.id === id);
      if (!task) return;

      await fetch(`/api/tasks/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          id: task.id,
          title: task.title,
          description: task.description,
          priority: task.priority,
          status: 'Completed',
          dueDate: task.dueDate,
          categoryId: task.categoryId
        })
      });
      await loadTasks();
    }

    async function deleteTask(id) {
      if (!confirm('Are you sure you want to delete this task?')) return;
      await fetch(`/api/tasks/${id}`, { method: 'DELETE' });
      await loadTasks();
    }

    function openCreateModal() {
      document.getElementById('task-title').value = '';
      document.getElementById('task-desc').value = '';
      document.getElementById('task-priority').value = 'Medium';
      document.getElementById('modal-error').style.display = 'none';
      document.getElementById('create-modal').style.display = 'flex';
    }

    function closeCreateModal() {
      document.getElementById('create-modal').style.display = 'none';
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    async function loadAllData() {
      await loadCategories();
      await loadTasks();
    }

    // Initial load
    loadAllData();
  </script>
</body>
</html>
